<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Conversaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Conversaciones</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="conversations.length === 0" class="empty-state">
    <p>vacio</p>
  </div>

  <ion-list>
    <ion-item *ngFor="let conversation of conversations" 
              (click)="openConversation(conversation.id)"
              class="conversation-item">
      <ion-label class="conversation-content">
        <h2>{{ conversation.userName }}</h2>
        <p>{{ conversation.lastMessage }}</p>
        <small>{{ formatTime(conversation.lastMessageTime) }}</small>
      </ion-label>
      <ion-button 
        slot="end" 
        fill="clear" 
        color="warning"
        (click)="openEditModal(conversation, $event)">
        <ion-icon slot="icon-only" [icon]="create"></ion-icon>
      </ion-button>
      <ion-button 
        slot="end" 
        fill="clear" 
        color="danger"
        (click)="deleteConversation(conversation.id, $event)">
        <ion-icon slot="icon-only" [icon]="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Editar -->
  <ion-modal #editModal class="edit-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>editar</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cancelEdit()">Cancelar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-input
          placeholder="Nombre de usuario"
          [(ngModel)]="editingUserName"
          type="text">
        </ion-input>
        <ion-button expand="block" (click)="updateConversation()" class="ion-margin-top">
          Guardar cambios
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Nueva conversacion -->
  <ion-modal #newConversationModal class="new-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Nueva conversación</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">Cancelar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-input
          placeholder="Nombre de usuario"
          [(ngModel)]="newUserName"
          type="text">
        </ion-input>
        <ion-button expand="block" (click)="createConversation()" class="ion-margin-top">
          Crear conversación
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- FAB button para crear nueva conversación -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openNewConversationModal()">
      <ion-icon [icon]="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
