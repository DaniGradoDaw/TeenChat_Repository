<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="login-container">
    <ion-list lines="full">
      <ion-item>
        <ion-input 
          label="Correo electrónico" 
          label-placement="floating" 
          type="email" 
          [(ngModel)]="loginData.email"
          placeholder="email@ejemplo.com">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input 
          label="Contraseña" 
          label-placement="floating" 
          type="password" 
          [(ngModel)]="loginData.password"
          placeholder="********">
        </ion-input>
      </ion-item>
    </ion-list>

    <div class="ion-margin-top">
      <ion-button expand="block" (click)="intentarLogin()">
        Entrar
      </ion-button>

      <ion-button expand="block" fill="clear" color="secondary" (click)="tab1()">
        Volver a Inicio
      </ion-button>
    </div>
  </div>
</ion-content>
