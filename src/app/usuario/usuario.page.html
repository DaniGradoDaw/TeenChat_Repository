<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido, {{ datosUsuario.nombre }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none">
        
        <ion-item>
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Nombre</h3>
            <p>{{ datosUsuario.nombre }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Email</h3>
            <p>{{ datosUsuario.email }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Fecha de Alta</h3>
            <p>{{ datosUsuario.fechaAlta }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </ion-card-content>
  </ion-card>

  <div class="ion-margin-top">
    <ion-button expand="block" color="danger" fill="outline" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>

  <div class="ion-margin-top">
    <ion-button expand="block" color="danger" fill="outline" (click)="forgotPasw()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Olvidé mi contraseña
    </ion-button>
  </div>

</ion-content>
